name: Deploy (Cloudflare Workers)

# Default deploy: OpenDocs runs on Cloudflare Workers Containers via
# `scripts/deploy-health-gate.mjs`, which wraps `wrangler deploy` in a health
# gate. `wrangler deploy` exits 0 as soon as a rollout is accepted, so a
# container image that never starts would otherwise stay live with a green run.
# The gate polls /api/health within a bounded budget and, on failure, redeploys
# CONTAINER_KNOWN_GOOD_IMAGE with the crawler-safe SEO mode forced on. It then
# fails the run so a rejected image is never reported as deployed.
#
# One-time setup:
#   1. Repository variables (Settings -> Variables):
#        CLOUDFLARE_ACCOUNT_ID       your Cloudflare account id
#        PUBLIC_APP_URL              https://<your public app host>
#        S3_BUCKET                   doc-assets bucket name
#        S3_ENDPOINT                 https://<account-id>.r2.cloudflarestorage.com
#        CONTAINER_KNOWN_GOOD_IMAGE  registry image with an explicit :tag or
#                                    @sha256:<digest> that is known to boot
#        SAFE_ROOT_ROBOTS            optional; defaults to "true"
#   2. Repository secret CLOUDFLARE_API_TOKEN (Workers + Containers + R2 + DNS
#      perms; Containers require the Workers Paid plan).
#   3. App secrets once: `wrangler secret put <NAME>` for DATABASE_URL,
#      OPENAI_API_KEY, BETTER_AUTH_SECRET, AUTH_GOOGLE_ID/SECRET, S3_*,
#      STRIPE_*, and optional OPS_METRICS_TOKEN. Secrets stay in Cloudflare
#      and never reach this workflow.
#
# `wrangler.jsonc` is gitignored; the gate renders it from the committed
# `wrangler.example.jsonc` using the non-secret repository variables above.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          known-good deploys CONTAINER_KNOWN_GOOD_IMAGE unchanged;
          build builds and deploys a new image from the Dockerfile.
        type: choice
        default: known-good
        options:
          - known-good
          - build
      health_check_attempts:
        description: Health poll attempts (1-40).
        type: string
        default: "20"
      health_check_interval_ms:
        description: Delay between health polls in ms (1000-60000).
        type: string
        default: "15000"
      health_check_required_successes:
        description: >-
          Consecutive healthy probes required before accepting a deploy.
          Guards against a lone probe hitting an instance that still runs the
          previous image during a gradual rollout.
        type: string
        default: "3"

permissions:
  contents: read

concurrency:
  # Never let two deploys race the same production rollout: a queued run could
  # otherwise overwrite an in-flight rollback.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: health-gated wrangler deploy
    runs-on: ubuntu-latest
    # Bounds the run above the gate's worst-case polling budget (40 x 60s x 2
    # health passes) plus image build and rollout time.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fails fast on a missing/floating CONTAINER_KNOWN_GOOD_IMAGE or a bad
      # variable before anything touches production.
      - name: Validate deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          CONTAINER_KNOWN_GOOD_IMAGE: ${{ vars.CONTAINER_KNOWN_GOOD_IMAGE }}
          SAFE_ROOT_ROBOTS: ${{ vars.SAFE_ROOT_ROBOTS }}
        run: node scripts/deploy-health-gate.mjs --mode "${{ inputs.mode || 'known-good' }}" --dry-run

      - name: Deploy with health gate and automatic rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          CONTAINER_KNOWN_GOOD_IMAGE: ${{ vars.CONTAINER_KNOWN_GOOD_IMAGE }}
          SAFE_ROOT_ROBOTS: ${{ vars.SAFE_ROOT_ROBOTS }}
          HEALTH_CHECK_ATTEMPTS: ${{ inputs.health_check_attempts || '20' }}
          HEALTH_CHECK_INTERVAL_MS: ${{ inputs.health_check_interval_ms || '15000' }}
          HEALTH_CHECK_REQUIRED_SUCCESSES: ${{ inputs.health_check_required_successes || '3' }}
        run: node scripts/deploy-health-gate.mjs --mode "${{ inputs.mode || 'known-good' }}"

      # wrangler.jsonc holds no secrets, but it is gitignored production config
      # and must never be exported from the runner.
      - name: Remove generated production config
        if: always()
        run: rm -f wrangler.jsonc
