name: Deploy (Cloudflare Workers)

# Default deploy: OpenDocs runs on Cloudflare Workers Containers via `wrangler deploy`.
#
# One-time setup:
#   1. Copy `wrangler.example.jsonc` -> `wrangler.jsonc` and fill in your
#      account_id, custom-domain route, and image_vars (your public app URL).
#   2. Add repo secret CLOUDFLARE_API_TOKEN (Workers + Containers + R2 + DNS perms;
#      requires the Workers Paid plan for Containers).
#   3. Set app secrets once: `wrangler secret put <NAME>` for DATABASE_URL,
#      OPENAI_API_KEY, BETTER_AUTH_SECRET, AUTH_GOOGLE_ID/SECRET, S3_* and STRIPE_*.
#
# CI materializes the gitignored production config from wrangler.example.jsonc
# using repository variables; no credentials are committed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Configure production deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const required = [
            "CLOUDFLARE_ACCOUNT_ID",
            "PUBLIC_APP_URL",
            "S3_BUCKET",
            "S3_ENDPOINT",
          ];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Missing repository variable ${name}`);
          }
          const appUrl = process.env.PUBLIC_APP_URL.replace(/\/$/, "");
          const config = fs
            .readFileSync("wrangler.example.jsonc", "utf8")
            .replace(
              '  // "account_id": "<your-cloudflare-account-id>",',
              `  "account_id": "${process.env.CLOUDFLARE_ACCOUNT_ID}",`,
            )
            .replace(
              '  // "routes": [{ "pattern": "docs.example.com", "custom_domain": true }],',
              `  "routes": [{ "pattern": "${new URL(appUrl).host}", "custom_domain": true }],`,
            )
            .replaceAll("https://docs.example.com", appUrl)
            .replace("your-doc-assets-bucket", process.env.S3_BUCKET)
            .replace(
              "https://<account-id>.r2.cloudflarestorage.com",
              process.env.S3_ENDPOINT,
            );
          fs.writeFileSync("wrangler.jsonc", config);
          NODE
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.jsonc
